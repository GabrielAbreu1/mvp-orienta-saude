kind = "web"
previewPath = "/"
title = "Triagem de Saúde"
version = "1.0.0"
id = "artifacts/triagem-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19003

[services.development]
run = "pnpm --filter @workspace/triagem-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/triagem-web", "run", "build" ]
publicDir = "artifacts/triagem-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19003"
BASE_PATH = "/"
